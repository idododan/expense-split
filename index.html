<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense split</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap');
  /* Colours, fonts and shapes from the old "Claude Spending — split with Guy" page. */
  :root {
    --ido: #FF6B9D;
    --ido-light: #FFE0EE;
    --guy: #6B9DFF;
    --guy-light: #E0EEFF;
    --bg: #FFF9F0;
    --text: #2D2640;
    --gray: #9E9BAD;
    --card: #FFFFFF;
    --shadow: 0 8px 32px rgba(45,38,64,0.10);
    --radius: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

  .header { background: linear-gradient(135deg, #FF6B9D 0%, #6B9DFF 100%); padding: 28px 20px 22px; text-align: center; position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.12); }
  .header::after  { content: ''; position: absolute; bottom: -60px; left: -30px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.08); }
  .header .eyebrow { font-size: 13px; color: #fff; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; position: relative; z-index: 1; margin-bottom: 6px; }
  .header h1 { font-weight: 900; font-size: 26px; color: #fff; position: relative; z-index: 1; text-shadow: 0 2px 8px rgba(0,0,0,0.15); line-height: 1.2; }
  .header .subtitle { color: rgba(255,255,255,0.92); font-size: 14px; margin-top: 6px; position: relative; z-index: 1; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #2D2640; color: #fff; padding: 12px 22px; border-radius: 20px; font-size: 14px; z-index: 200; transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .content { padding: 16px; max-width: 560px; margin: 0 auto; }

  /* Summary card */
  .summary { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 20px; margin-bottom: 18px; }
  .summary.error { text-align: center; color: #c62828; font-weight: 700; }
  .summary.picker a { display: block; text-align: center; padding: 12px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; border-radius: 14px; }
  .summary.picker a:hover { background: var(--guy-light); }
  .total-row { text-align: center; }
  .total-label { font-size: 13px; color: var(--gray); letter-spacing: 0.5px; }
  .total-amount { font-weight: 900; font-size: 40px; line-height: 1.1; margin-top: 2px; }
  .divider { height: 1px; background: #F0EEF5; margin: 18px 0; }
  .balance-row { text-align: center; margin-bottom: 6px; }
  .balance-label { font-size: 13px; color: var(--gray); }
  .balance-amount { font-weight: 900; font-size: 30px; line-height: 1.1; margin-top: 2px; }
  .carried { font-size: 12px; color: var(--gray); margin-top: 3px; }
  .settle-note { margin-top: 14px; background: #E8F5E9; color: #2e7d32; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 700; text-align: center; line-height: 1.4; }
  .warn { background: #FFF3E0; color: #e65100; border-radius: 14px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }

  /* Add payment */
  .pay-wrap { text-align: center; margin-top: 14px; }
  .pay-btn { background: linear-gradient(135deg, #FF6B9D 0%, #6B9DFF 100%); color: #fff; border: none; border-radius: 20px; padding: 9px 20px; font-family: 'Heebo', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .pay-btn:active { transform: scale(0.96); }
  .pay-btn:disabled { opacity: 0.6; cursor: default; }
  .link-btn { background: none; border: none; color: var(--gray); font-family: 'Heebo', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; padding: 9px 12px; }
  .pay-form { margin-top: 14px; border-top: 1px solid #F0EEF5; padding-top: 14px; display: grid; gap: 10px; }
  .pay-form label { display: grid; gap: 4px; font-size: 12px; color: var(--gray); font-weight: 700; }
  .pay-form input, .pay-form select { font-family: 'Heebo', sans-serif; font-size: 15px; color: var(--text); padding: 8px 10px; border: 1px solid #E4E1EC; border-radius: 12px; background: #fff; width: 100%; }
  .pay-form .pair { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .pay-actions { display: flex; justify-content: flex-end; gap: 6px; }
  .pay-hint { font-size: 11px; color: var(--gray); line-height: 1.4; }

  /* Receipts */
  .section-title { font-size: 13px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin: 6px 4px 10px; }
  details.group { margin-top: 14px; }
  details.group > summary { cursor: pointer; list-style: none; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: '▸ '; }
  details.group[open] > summary::before { content: '▾ '; }
  .receipt { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .receipt.skipped { opacity: 0.6; }
  .receipt .icon { font-size: 22px; }
  .receipt .info { flex: 1; min-width: 0; }
  .receipt .desc { font-weight: 700; font-size: 15px; }
  .receipt .desc .sub { font-weight: 400; color: var(--text); }
  .receipt .meta { font-size: 12px; color: var(--gray); margin-top: 2px; overflow-wrap: anywhere; }
  .receipt .money { text-align: right; white-space: nowrap; }
  .receipt .amount { font-weight: 900; font-size: 17px; }
  .receipt .amount .conv { font-weight: 400; font-size: 12px; color: var(--gray); }
  .receipt .amount .na { color: var(--gray); }
  .receipt .half { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .empty { text-align: center; color: var(--gray); font-size: 14px; padding: 10px; }

  .footer { text-align: center; padding: 16px; font-size: 11px; color: #B7B4C4; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <p class="eyebrow" id="eyebrow">Expense split 💸</p>
  <h1 id="title">Loading…</h1>
  <p class="subtitle" id="subtitle"></p>
</div>

<div class="toast" id="toast"></div>

<div class="content" id="content"></div>

<div class="footer" id="footer"></div>

<script src="app.js"></script>
</body>
</html>
