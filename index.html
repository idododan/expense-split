<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ido: #FF6B9D; --ido-light: #FFE0EE;
    --guy: #6B9DFF; --guy-light: #E0EEFF;
    --bg: #FFF9F0; --text: #2D2640; --gray: #9E9BAD; --card: #FFFFFF;
    --line: #F0EEF5;
    --shadow: 0 8px 32px rgba(45,38,64,0.10);
    --radius: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }

  .header { background: linear-gradient(135deg, #FF6B9D 0%, #6B9DFF 100%); padding: 28px 20px 22px; text-align: center; position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.12); }
  .header::after  { content: ''; position: absolute; bottom: -60px; left: -30px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.08); }
  .header > * { position: relative; z-index: 1; }
  .header .eyebrow { font-size: 13px; color: #fff; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
  .header h1 { font-weight: 900; font-size: 26px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.15); line-height: 1.2; }
  .header .subtitle { color: rgba(255,255,255,0.92); font-size: 14px; margin-top: 6px; }
  .update-btn { margin-top: 14px; background: rgba(255,255,255,0.22); color: #fff; border: none; border-radius: 20px; padding: 9px 18px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .update-btn:hover { background: rgba(255,255,255,0.32); }
  .update-btn:active { transform: scale(0.96); }
  .update-btn:disabled { opacity: 0.6; cursor: default; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #2D2640; color: #fff; padding: 12px 22px; border-radius: 20px; font-size: 14px; z-index: 200; transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .content { padding: 16px; max-width: 560px; margin: 0 auto; }

  /* Summary card — mockup A */
  .summary { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 20px; margin-bottom: 18px; }
  .summary.notice { font-size: 14px; line-height: 1.5; color: var(--text); }
  .total-row { text-align: center; }
  .total-label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .total-amount { font-weight: 900; font-size: 40px; line-height: 1.1; margin-top: 4px; }
  .pending { font-size: 12px; color: var(--gray); margin-top: 10px; text-align: center; }
  .since { font-size: 13px; color: var(--text); text-align: center; margin-top: 12px; line-height: 1.5; }
  .totals { font-size: 13px; color: var(--text); text-align: center; line-height: 1.5; }
  .totals b, .since b { font-weight: 700; }
  .divider { height: 1px; background: var(--line); margin: 18px 0; }
  .balance-row { text-align: center; }
  .balance-label { font-size: 13px; color: var(--gray); }
  .balance-amount { font-weight: 900; font-size: 30px; line-height: 1.1; margin-top: 2px; }
  .carried { font-size: 12px; color: var(--gray); margin-top: 6px; }
  .settle-note { margin-top: 14px; background: #E8F5E9; color: #2e7d32; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 700; text-align: center; line-height: 1.4; }
  .fx { text-align: center; font-size: 11px; color: var(--gray); margin-top: 10px; }
  .add-btn { display: block; margin: 14px auto 0; background: var(--text); color: #fff; border: none; border-radius: 20px; padding: 10px 20px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; transition: transform 0.15s, opacity 0.15s; }
  .add-btn:hover { opacity: 0.9; }
  .add-btn:active { transform: scale(0.96); }

  /* Payment form */
  .pay-form { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .pay-form label { font-size: 12px; color: var(--gray); font-weight: 700; display: flex; flex-direction: column; gap: 4px; }
  .pay-form label.wide { grid-column: 1 / -1; }
  .pay-form input, .pay-form select { font-family: inherit; font-size: 15px; color: var(--text); border: 1px solid #E4E1EC; border-radius: 12px; padding: 9px 12px; background: #FAF9FC; width: 100%; }
  .pay-form input:focus, .pay-form select:focus { outline: 2px solid var(--guy); border-color: transparent; }
  .pay-form .actions { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .pay-form .actions button { font-family: inherit; font-weight: 700; font-size: 14px; border-radius: 20px; padding: 9px 18px; border: 1px solid #E4E1EC; background: #fff; color: var(--text); cursor: pointer; }
  .pay-form .actions button.primary { background: linear-gradient(135deg, #FF6B9D 0%, #6B9DFF 100%); color: #fff; border: none; }
  .pay-form .actions button:disabled { opacity: 0.6; cursor: default; }
  .pay-status { grid-column: 1 / -1; font-size: 13px; min-height: 1.2em; color: var(--text); }

  /* Receipts */
  .section-title { font-size: 13px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin: 6px 4px 10px; }
  .receipt { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .receipt .icon { font-size: 22px; }
  .receipt .info { flex: 1; min-width: 0; }
  .receipt .desc { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .receipt .desc .sep { color: var(--gray); font-weight: 400; }
  .receipt .meta { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .receipt .money { text-align: right; white-space: nowrap; }
  .receipt .amount { font-weight: 900; font-size: 17px; }
  .receipt .amount .conv { font-weight: 400; font-size: 12px; color: var(--gray); }
  .receipt .half { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .receipt.uncounted { opacity: 0.72; box-shadow: none; border: 1px dashed #E4E1EC; }
  .receipt.uncounted .amount { font-weight: 700; font-size: 15px; color: var(--gray); }
  .receipt.strike .desc, .receipt.strike .amount { text-decoration: line-through; }
  .empty { color: var(--gray); font-size: 14px; text-align: center; padding: 10px; }
  details.earlier { margin-top: 18px; }
  details.earlier summary { cursor: pointer; list-style: none; }
  details.earlier summary::-webkit-details-marker { display: none; }
  details.earlier summary::before { content: '▸ '; }
  details[open].earlier summary::before { content: '▾ '; }

  /* Project chooser */
  .chooser { display: grid; gap: 10px; }
  .project-link { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 16px; padding: 14px 16px; border-radius: 16px; background: #FAF9FC; border: 1px solid #E4E1EC; }
  .project-link:hover { border-color: var(--guy); }
  .project-link .meta { font-size: 12px; color: var(--gray); font-weight: 400; }

  .footer { text-align: center; padding: 16px; font-size: 11px; color: #B7B4C4; line-height: 1.6; }
  .footer a { color: #B7B4C4; }
</style>
</head>
<body>

<div class="header">
  <p class="eyebrow" id="eyebrow">Shared expenses 💸</p>
  <h1 id="title">Expense split</h1>
  <p class="subtitle" id="subtitle">loading…</p>
  <button class="update-btn" id="refresh-btn" type="button">🔄 Refresh</button>
</div>

<div class="toast" id="toast"></div>

<div class="content" id="content">
  <div class="summary notice">Loading…</div>
</div>

<div class="footer"><span id="footer-text"></span></div>

<script src="app.js?v=2026-11-08c"></script>
</body>
</html>
